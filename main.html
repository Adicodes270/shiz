<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>@Throne</title>
  <meta name="description" content="Shiz Portfolio Showcasing his best servers his vanity's on sale and events ongoing">
  <!-- <link rel="icon" type="image/x-icon" href="assets/minato.gif"> -->

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="theme.css">

  <style>
    /* ── ENTRY WIPE PANEL ── */
    /* Sits on top of everything when the page first loads.
       script.js will slide it away upward to reveal the page. */
    #entry-wipe {
      position: fixed;
      inset: 0;
      background: var(--purple, #6b00d4);
      z-index: 99999;
      transform: scaleY(1);
      transform-origin: top center;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <!-- ── PAGE WIPE: covers screen during transitions, lives outside Barba container ── -->
  <div id="page-wipe"></div>

  <!-- Entry wipe panel — covers page on arrival, gets slid away by GSAP -->
  <div id="entry-wipe"></div>

  <script>
    if (!sessionStorage.getItem('introSeen')) {
      window.location.href = 'index.html';
    }
  </script>

  
  <div id="particle-bg"></div>
  <div class="custom-cursor"></div>
  <audio id="bg-music" src="assets/legacy.mp3" preload="auto"></audio>

  <!-- ── NAV: outside Barba wrapper so it persists across page transitions ── -->
  <nav>
    <div class="wrap">
      <div class="nav-inner">
        <a class="nav-brand" href="#">
          <img src="assets/minato.gif" alt="shiz" class="nav-brand-logo">
          <span class="nav-brand-name">@THRONE</span>
        </a>
        <ul class="nav-links">
          <li><a href="main.html" class="active">Home</a></li>
          <li><a href="servers.html">Servers</a></li>
          <li><a href="onsale.html">On Sale</a></li>
          <li><a href="events.html">Events</a></li>
        </ul>
        <div class="nav-end">
          <a class="nav-gh" href="https://discord.com/users/172108151024254976" target="_blank">Discord Profile</a>
          <a class="nav-add" href="https://discord.gg/indeku" target="_blank">Server Link</a>
        </div>
        <button class="nav-toggle" id="nav-toggle" aria-label="Menu">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <line x1="4" y1="6" x2="20" y2="6" />
            <line x1="4" y1="12" x2="20" y2="12" />
            <line x1="4" y1="18" x2="20" y2="18" />
          </svg>
        </button>
      </div>
      <div class="mobile-menu" id="mobile-menu">
        <button class="nav-close" id="nav-close" aria-label="Menu">
          <i class="fa-solid fa-x"></i>
        </button>
        <a href="main.html">Home</a>
        <a href="servers.html">Servers</a>
        <a href="onsale.html">On Sale</a>
        <a href="events.html">Events</a>
        <a href="https://discord.gg/indeku" target="_blank">Server Link</a>
      </div>
    </div>
  </nav>

  <!-- ── BARBA WRAPPER ── -->
  <div data-barba="wrapper">
    <main data-barba="container" data-barba-namespace="home">

      <section class="hero">
        <div class="profile-card gsap-hidden">
          <div class="profile-glow"></div>

          <!-- View Counter Badge -->
          <div class="profile-view">
            <svg class="profile-view-icon" width="16" height="16" viewBox="0 0 24 24" fill="none"
              xmlns="http://www.w3.org/2000/svg">
              <path d="M1 12C1 12 5 4 12 4C19 4 23 12 23 12C23 12 19 20 12 20C5 20 1 12 1 12Z" stroke="#4d8fff"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
              <circle cx="12" cy="12" r="3" stroke="#4d8fff" stroke-width="2" />
            </svg>
            <span id="view-count">...</span>
          </div>

          <!-- Top Text Layout Header -->
          <div class="profile-heading-group gsap-hidden">
            <h1 class="main-card-title">SHIZ</h1>
            <p class="main-card-subtitle">A name means nothing without a legacy
            </p>
          </div>

          <!-- User Discord Banner Card Row Layer -->
          <div class="profile-header-banner" id="user-banner-target">
            <div class="profile-header-inner-content">
              <div class="avatar-container">
                <img class="profile-avatar gsap-hidden" src="" alt="Avatar">
                <img class="decoration" src="" alt="Avatar Decoration">
              </div>
              <div class="profile-identity">
                <h1 class="profile-title gsap-hidden">shiz</h1>
                <h2 class="profile-subtitle gsap-hidden">@exemplarism</h2>
              </div>
              <div class="discord-badges">
                <img src="assets/nitro-emerald.png" alt="Nitro">
                <img src="assets/server-boost.png" alt="Boost">
              </div>
            </div>
          </div>

          <div class="inner-cards-stack">

            <div class="inner-stack-row gsap-hidden">
              <div class="row-left-content">
                <img src="assets/minato.gif" alt="shiz" class="row-thumb" id="small-avatar">
                <div class="row-meta">
                  <h3 class="row-title">@exemplarism</h3>
                  <p class="row-desc">Discord User</p>
                </div>
              </div>
              <a href="https://discord.com/users/172108151024254976" target="_blank"
                class="row-action-btn add-friend-btn">
                Add Friend
              </a>
            </div>

            <div class="inner-stack-row gsap-hidden">
              <div class="row-left-content">
                <img src="assets/throne.jpg" alt="shiz" class="row-thumb">
                <div class="row-meta">
                  <h3 class="row-title">@Throne</h3>
                  <p class="row-desc">Join Telegram</p>
                </div>
              </div>
              <a href="https://t.me/tsshiz" target="_blank" class="row-action-btn telegram-btn">
                Join
              </a>
            </div>

            <div class="inner-stack-row gsap-hidden" data-invite="indeku">
              <div class="row-left-content">
                <img src="assets/deku.jpg" alt="Deku" class="row-thumb">
                <div class="row-meta">
                  <h3 class="row-title">/deku</h3>
                  <div class="row-stats-group">
                    <span class="stat-online"><span class="status-dot online"></span>61 Online</span>
                    <span class="stat-total"><span class="status-dot members"></span>726 Members</span>
                  </div>
                </div>
              </div>
              <a href="https://discord.gg/indeku" target="_blank" class="row-action-btn join-server-btn">
                Join
              </a>
            </div>

          </div>
        </div>
      </section>

      <div class="divider"></div>

    </main>
  </div><!-- /#barba-wrapper -->

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.1/gsap.min.js"
    integrity="sha512-qF6akR/fsZAB4Co1QDDnUXWnaQseLGXoniuSuSlPQK6+aWhlMZcHzkasCSlnWoe+TJuudlka1/IQ01Dnhgq95g=="
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.1/ScrollTrigger.min.js"
    integrity="sha512-IHDCHrefnBT3vOCsvdkMvJF/MCPz/nBauQLzJkupa4Gn4tYg5a6VGyzIrjo6QAUy3We5HFOZUlkUpP0dkgE60A=="
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="https://unpkg.com/@barba/core"></script>
  <script src="script.js"></script>
</body>

</html>
