<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>@Hokage</title>
  <meta name="description"
    content="Shiz Portfolio - Showcasing the best Discord servers owned by Shiz, including Madara's server with 1.4k members and 100+ online always. Join now to experience the ultimate Discord community!">
  <link rel="icon" type="image/x-icon" href="assets/minato.gif">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="theme.css">
  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --blue: hsl(200, 92%, 34%);
      --blue-bright: hsl(200, 100%, 55%);
      --bg: #070709;
    }

    body {
      background: var(--bg);
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── RADAR RINGS ── */
    .radar {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .radar span {
      position: absolute;
      border-radius: 50%;
      border: 1.5px solid var(--purple);
      opacity: 0;
      animation: radarRing 3s ease-out infinite;
    }

    .radar span:nth-child(1) {
      width: 120px;
      height: 120px;
      animation-delay: 0s;
    }

    .radar span:nth-child(2) {
      width: 120px;
      height: 120px;
      border-color: var(--grey);
      animation-delay: 0.75s;
    }

    .radar span:nth-child(3) {
      width: 120px;
      height: 120px;
      animation-delay: 1.5s;
    }

    .radar span:nth-child(4) {
      width: 120px;
      height: 120px;
      border-color: var(--grey);
      animation-delay: 2.25s;
    }

    @keyframes radarRing {
      0% {
        transform: scale(0.2);
        opacity: 0.9;
      }

      100% {
        transform: scale(8);
        opacity: 0;
      }
    }

    /* ── SCAN LINE ── */
    .scanline {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--purple-bright), transparent);
      opacity: 0.3;
      animation: scan 3s linear infinite;
      pointer-events: none;
    }

    @keyframes scan {
      0% {
        top: -2px;
      }

      100% {
        top: 100vh;
      }
    }

    /* ── GRID BACKGROUND ── */
    .grid {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0, 150, 200, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 150, 200, 0.04) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
    }

    /* ── MAIN TEXT ── */
    .intro-wrap {
      position: relative;
      z-index: 10;
      text-align: center;
    }

    .intro-text {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(100px, 22vw, 240px);
      color: transparent;
      -webkit-text-stroke: 2px var(--purple-bright);
      letter-spacing: 0.08em;
      line-height: 1;
      position: relative;
      animation: textReveal 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.4s both;
      filter: drop-shadow(0 0 30px var(--purple)) drop-shadow(0 0 80px rgba(128, 0, 128, 0.4));
    }

    /* filled clone — content left empty so it inherits typewriter text */
    .intro-text::before {
      content: '';
      position: absolute;
      inset: 0;
      color: var(--purple-bright);
      -webkit-text-stroke: 0;
      opacity: 0.08;
    }

    /* glitch layer — content left empty so it inherits typewriter text */
    .intro-text::after {
      content: '';
      position: absolute;
      inset: 0;
      color: var(--purple-bright);
      -webkit-text-stroke: 2px var(--purple-bright);
      opacity: 0;
      animation: glitch 4s ease-in-out 1.4s infinite;
      clip-path: polygon(0 30%, 100% 30%, 100% 50%, 0 50%);
    }

    @keyframes textReveal {
      0% {
        opacity: 0;
        transform: scaleX(0.6) skewX(-8deg);
        filter: drop-shadow(0 0 60px var(--purple-bright));
      }

      60% {
        opacity: 1;
        transform: scaleX(1.04) skewX(1deg);
      }

      100% {
        opacity: 1;
        transform: scaleX(1) skewX(0);
      }
    }

    @keyframes glitch {

      0%,
      90%,
      100% {
        opacity: 0;
        transform: translate(0);
      }

      91% {
        opacity: 0.8;
        transform: translate(-6px, 0);
        filter: hue-rotate(90deg);
      }

      93% {
        opacity: 0.8;
        transform: translate(6px, 0);
      }

      95% {
        opacity: 0.8;
        transform: translate(-3px, 0);
        filter: hue-rotate(180deg);
      }

      97% {
        opacity: 0;
        transform: translate(0);
      }
    }

    /* ── CURSOR BLINK ── */
    .intro-text .cursor {
      display: inline-block;
      width: 3px;
      background: var(--purple-bright);
      margin-left: 4px;
      animation: blink 0.7s infinite;
      vertical-align: baseline;
      height: 0.85em;
    }

    @keyframes blink {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0;
      }
    }

    /* ── SUBTITLE ── */
    .intro-sub {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(14px, 2.5vw, 22px);
      letter-spacing: 0.5em;
      color: var(--purple);
      opacity: 0;
      margin-top: 8px;
      animation: fadeUp 0.6s ease 1.1s both;
      text-transform: uppercase;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(12px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ── LOADING BAR ── */
    .loader-track {
      width: clamp(160px, 30vw, 280px);
      height: 2px;
      background: rgba(255, 255, 255, 0.07);
      margin: 28px auto 0;
      border-radius: 999px;
      overflow: hidden;
      opacity: 0;
      animation: fadeUp 0.4s ease 1.3s both;
    }

    .loader-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--purple), var(--purple-bright));
      border-radius: 999px;
      box-shadow: 0 0 10px var(--purple-bright);
      animation: load 2.2s cubic-bezier(0.4, 0, 0.2, 1) 1.5s both;
    }

    @keyframes load {
      0% {
        width: 0%;
      }

      100% {
        width: 100%;
      }
    }

    /* ── PAGE EXIT ── */
    .overlay-exit {
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      animation: exitFade 0.6s ease 3.9s both;
    }

    @keyframes exitFade {
      0% {
        opacity: 0;
      }

      100% {
        opacity: 1;
      }
    }
  </style>
</head>

<body>

  <div class="grid"></div>
  <div class="scanline"></div>

  <div class="radar">
    <span></span><span></span><span></span><span></span>
  </div>

  <div class="intro-wrap">
    <div class="intro-text"><span class="cursor"></span></div>
    <div class="intro-sub">@shizfs</div>
    <div class="loader-track">
      <div class="loader-fill"></div>
    </div>
  </div>

  <div class="overlay-exit"></div>

  
  <script>
    setTimeout(() => {
      sessionStorage.setItem('introSeen', 'true');
      window.location.href = 'main.html';
    }, 4500);

    const text = "HOKAGE";
    const el = document.querySelector('.intro-text');
    const cursor = el.querySelector('.cursor');
    let i = 0;

    function type() {
      if (i < text.length) {
        // insert text before the cursor span
        el.insertBefore(document.createTextNode(text[i]), cursor);
        i++;
        setTimeout(type, 600);
      } else {
        // hide cursor after done typing
        setTimeout(() => cursor.style.display = 'none', 800);
      }
    }

    type();


  </script>
</body>

</html>
