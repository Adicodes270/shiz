<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>@Throne</title>
  <meta name="description" content="Shiz Portfolio Showcasing his best servers his vanity's on sale and events ongoing">
  <link rel="icon" type="image/x-icon" href="assets/minato.gif">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="theme.css">
  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --blue: hsl(200, 92%, 34%);
      --blue-bright: hsl(200, 100%, 55%);
      --bg: #070709;
    }

    body {
      background: var(--bg);
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── SCAN LINE ── */
    .scanline {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--purple-bright), transparent);
      opacity: 0.3;
      animation: scan 3s linear infinite;
      pointer-events: none;
    }

    @keyframes scan {
      0% {
        top: -2px;
      }

      100% {
        top: 100vh;
      }
    }

    /* ── GRID BACKGROUND ── */
    .grid {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0, 150, 200, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 150, 200, 0.04) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
    }

    /* ── MAIN TEXT ── */
    .intro-wrap {
      position: relative;
      z-index: 10;
      text-align: center;
    }

    .intro-text {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(100px, 22vw, 240px);
      color: transparent;
      -webkit-text-stroke: 2px var(--purple-bright);
      letter-spacing: 0.08em;
      line-height: 1;
      position: relative;
      animation: textReveal 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.4s both;
      filter: drop-shadow(0 0 30px var(--purple)) drop-shadow(0 0 80px rgba(128, 0, 128, 0.4));
    }

    .intro-text::before {
      content: '';
      position: absolute;
      inset: 0;
      color: var(--purple-bright);
      -webkit-text-stroke: 0;
      opacity: 0.08;
    }

    .intro-text::after {
      content: '';
      position: absolute;
      inset: 0;
      color: var(--purple-bright);
      -webkit-text-stroke: 2px var(--purple-bright);
      opacity: 0;
      animation: glitch 4s ease-in-out 1.4s infinite;
      clip-path: polygon(0 30%, 100% 30%, 100% 50%, 0 50%);
    }

    @keyframes textReveal {
      0% {
        opacity: 0;
        transform: scaleX(0.6) skewX(-8deg);
        filter: drop-shadow(0 0 60px var(--purple-bright));
      }

      60% {
        opacity: 1;
        transform: scaleX(1.04) skewX(1deg);
      }

      100% {
        opacity: 1;
        transform: scaleX(1) skewX(0);
      }
    }

    @keyframes glitch {

      0%,
      90%,
      100% {
        opacity: 0;
        transform: translate(0);
      }

      91% {
        opacity: 0.8;
        transform: translate(-6px, 0);
        filter: hue-rotate(90deg);
      }

      93% {
        opacity: 0.8;
        transform: translate(6px, 0);
      }

      95% {
        opacity: 0.8;
        transform: translate(-3px, 0);
        filter: hue-rotate(180deg);
      }

      97% {
        opacity: 0;
        transform: translate(0);
      }
    }

    /* ── CURSOR BLINK ── */
    .intro-text .cursor {
      display: inline-block;
      width: 3px;
      background: var(--purple-bright);
      margin-left: 4px;
      animation: blink 0.7s infinite;
      vertical-align: baseline;
      height: 0.85em;
    }

    @keyframes blink {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0;
      }
    }

    /* ── SUBTITLE ── */
    .intro-sub {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(14px, 2.5vw, 22px);
      letter-spacing: 0.5em;
      color: var(--purple);
      opacity: 0;
      margin-top: 8px;
      animation: fadeUp 0.6s ease 1.1s both;
      text-transform: uppercase;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(12px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ── LOADING BAR ── */
    .loader-track {
      width: clamp(160px, 30vw, 280px);
      height: 2px;
      background: rgba(255, 255, 255, 0.07);
      margin: 28px auto 0;
      border-radius: 999px;
      overflow: hidden;
      opacity: 0;
      animation: fadeUp 0.4s ease 1.3s both;
    }

    .loader-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--purple), var(--purple-bright));
      border-radius: 999px;
      box-shadow: 0 0 10px var(--purple-bright);
      animation: load 2.2s cubic-bezier(0.4, 0, 0.2, 1) 1.5s both;
    }

    @keyframes load {
      0% {
        width: 0%;
      }

      100% {
        width: 100%;
      }
    }

    /* ── TRANSITION WIPE OVERLAY ── */
    /* Covers the screen with a purple panel that slides UP, then page changes */
    .transition-wipe {
      position: fixed;
      inset: 0;
      background: var(--purple, #0047d4);
      z-index: 9999;
      transform: scaleY(0);
      transform-origin: bottom center;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <div class="grid"></div>
  <div class="scanline"></div>

  <div class="intro-wrap">
    <div class="intro-text"><span class="cursor"></span></div>
    <div class="intro-sub">@shizfs</div>
    <div class="loader-track">
      <div class="loader-fill"></div>
    </div>
  </div>

  <!-- The wipe panel -->
  <div class="transition-wipe" id="wipe"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.1/gsap.min.js"
    integrity="sha512-qF6akR/fsZAB4Co1QDDnUXWnaQseLGXoniuSuSlPQK6+aWhlMZcHzkasCSlnWoe+TJuudlka1/IQ01Dnhgq95g=="
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>

  <script>
    // ── TYPEWRITER ──
    const text = "THRONE";
    const el = document.querySelector('.intro-text');
    const cursor = el.querySelector('.cursor');
    let i = 0;

    function type() {
      if (i < text.length) {
        el.insertBefore(document.createTextNode(text[i]), cursor);
        i++;
        setTimeout(type, 600);
      } else {
        setTimeout(() => cursor.style.display = 'none', 800);
      }
    }

    type();

    // ── TRANSITION TO MAIN ──
    // Total intro time: loader starts at 1.5s and runs 2.2s → done at ~3.7s
    // We start the wipe at 3.8s so it kicks in right as loader finishes
    setTimeout(() => {
      sessionStorage.setItem('introSeen', 'true');

      const wipe = document.getElementById('wipe');

      // Phase 1: purple panel slides UP from bottom, covering entire screen (0.6s)
      gsap.to(wipe, {
        scaleY: 1,
        transformOrigin: 'bottom center',
        duration: 0.6,
        ease: 'power3.inOut',
        onComplete: () => {
          // Once fully covered, navigate
          window.location.href = 'main.html';
        }
      });

    }, 3800);

    // ── BACKGROUND PRE-FETCHING & PRE-LOADING ──
    const DISCORD_USER_ID = '172108151024254976';

    async function prefetchDiscordAssets() {
      try {
        const response = await fetch(`https://api.lanyard.rest/v1/users/${DISCORD_USER_ID}`);
        const jsonResult = await response.json();

        if (jsonResult.success) {
          const userData = jsonResult.data;
          const userId = userData.discord_user.id;
          const avatarHash = userData.discord_user.avatar;
          const decorationHash = userData.discord_user.avatar_decoration_data?.asset;

          if (avatarHash) {
            const isAnimated = avatarHash.startsWith("a_");
            const fileExtension = isAnimated ? "gif" : "png";
            const avatarUrl = `https://cdn.discordapp.com/avatars/${userId}/${avatarHash}.${fileExtension}?size=512`;

            sessionStorage.setItem('cachedAvatar', avatarUrl);
            const img = new Image();
            img.src = avatarUrl;
          }

          if (decorationHash) {
            const decorationUrl = `https://cdn.discordapp.com/avatar-decoration-presets/${decorationHash}.png?size=240&passthrough=true`;
            sessionStorage.setItem('cachedDecoration', decorationUrl);
            const img = new Image();
            img.src = decorationUrl;
          } else {
            sessionStorage.removeItem('cachedDecoration');
          }
        }
      } catch (error) {
        console.error("Error pre-fetching assets:", error);
      }
    }

    prefetchDiscordAssets();
  </script>

</body>

</html>
